<svg width="620" height="180" viewBox="0 0 620 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Palawan Property Group logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .scriptName { font-family:'Pacifico', cursive; font-size:74px; }
      .subName { font-family:'Montserrat', sans-serif; font-weight:700; font-size:17px; fill:#16407A; letter-spacing:7px; }

      @keyframes sunPulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
      @keyframes rayPulse { 0%,100%{ opacity:0.9; transform:scale(1);} 50%{ opacity:1; transform:scale(1.12);} }
      @keyframes haloBreath { 0%,100%{ opacity:0.45;} 50%{ opacity:0.75;} }
      @keyframes frondSway1 { 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-3deg);} }
      @keyframes frondSway2 { 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(3deg);} }
      @keyframes waveRoll { 0%{ transform:translateX(0);} 100%{ transform:translateX(-44px);} }
      @keyframes shimmer { 0%,100%{ opacity:0.55;} 50%{ opacity:0.9;} }

      .sunBody { transform-origin:96px 70px; animation:sunPulse 5s ease-in-out infinite; }
      .rays { transform-origin:96px 70px; animation:rayPulse 4s ease-in-out infinite; }
      .halo { transform-origin:96px 70px; animation:haloBreath 5s ease-in-out infinite; }
      .fronds1 { transform-origin:78px 58px; animation:frondSway1 6s ease-in-out infinite; }
      .fronds2 { transform-origin:560px 64px; animation:frondSway2 6.5s ease-in-out infinite; }
      .shine { animation:shimmer 4s ease-in-out infinite; }
      .waveSet { animation:waveRoll 7s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sunBody,.rays,.halo,.fronds1,.fronds2,.shine,.waveSet { animation:none; }
      }
    </style>

    <radialGradient id="sunG" cx="40%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#FFF6BF"/>
      <stop offset="32%" stop-color="#FFD83F"/>
      <stop offset="68%" stop-color="#FF9E12"/>
      <stop offset="100%" stop-color="#F46E00"/>
    </radialGradient>
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCB3D" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFCB3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFCB3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11C2F0"/>
      <stop offset="55%" stop-color="#11A8E6"/>
      <stop offset="100%" stop-color="#1488D8"/>
    </linearGradient>
    <clipPath id="waveClip"><rect x="0" y="118" width="620" height="46"/></clipPath>
  </defs>

  <circle class="halo" cx="96" cy="70" r="60" fill="url(#haloG)"/>

  <g class="rays" stroke="#FFB81C" stroke-linecap="round">
    <g stroke-width="4">
      <line x1="96" y1="22" x2="96" y2="6"/>
      <line x1="150" y1="70" x2="166" y2="70"/>
      <line x1="133" y1="33" x2="144" y2="22"/>
      <line x1="133" y1="107" x2="144" y2="118"/>
      <line x1="59" y1="33" x2="48" y2="22"/>
      <line x1="42" y1="70" x2="26" y2="70"/>
      <line x1="59" y1="107" x2="48" y2="118"/>
    </g>
    <g stroke-width="2.8" stroke="#FFD23F">
      <line x1="116" y1="26" x2="123" y2="13"/>
      <line x1="146" y1="48" x2="159" y2="41"/>
      <line x1="146" y1="92" x2="159" y2="99"/>
      <line x1="76" y1="26" x2="69" y2="13"/>
      <line x1="46" y1="48" x2="33" y2="41"/>
      <line x1="46" y1="92" x2="33" y2="99"/>
    </g>
  </g>

  <g class="sunBody">
    <circle cx="96" cy="70" r="40" fill="url(#sunG)"/>
    <circle class="shine" cx="82" cy="56" r="15" fill="#FFF9D6" opacity="0.6"/>
    <circle cx="80" cy="54" r="6" fill="#FFFEF2" opacity="0.85"/>
  </g>

  <path d="M24 158 Q38 126 56 98 Q68 80 80 64" stroke="#7C5230" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g class="fronds1">
    <path d="M80 64 Q56 46 36 52 Q58 60 80 64Z" fill="#33A02C"/>
    <path d="M80 64 Q62 34 66 16 Q74 42 80 64Z" fill="#4BBF3E"/>
    <path d="M80 64 Q104 40 120 46 Q98 58 80 64Z" fill="#33A02C"/>
    <path d="M80 64 Q46 64 34 76 Q60 70 80 64Z" fill="#2A8C24"/>
    <circle cx="78" cy="66" r="3.5" fill="#8B5E2A"/>
    <circle cx="84" cy="68" r="3.5" fill="#8B5E2A"/>
  </g>

  <path d="M584 160 Q574 130 566 104 Q560 84 556 68" stroke="#7C5230" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g class="fronds2">
    <path d="M556 68 Q574 50 594 56 Q574 62 556 68Z" fill="#33A02C"/>
    <path d="M556 68 Q560 46 570 36 Q560 54 556 68Z" fill="#4BBF3E"/>
    <path d="M556 68 Q538 50 524 56 Q542 62 556 68Z" fill="#33A02C"/>
    <path d="M556 68 Q536 66 528 78 Q546 72 556 68Z" fill="#2A8C24"/>
  </g>

  <text x="150" y="100" class="scriptName" fill="url(#nameG)">Palawan</text>
  <text x="158" y="130" class="subName">PROPERTY GROUP</text>

  <g clip-path="url(#waveClip)">
    <g class="waveSet">
      <path d="M-44 140 Q-22 132 0 140 Q22 148 44 140 Q66 132 88 140 Q110 148 132 140 Q154 132 176 140 Q198 148 220 140 Q242 132 264 140 Q286 148 308 140 Q330 132 352 140 Q374 148 396 140 Q418 132 440 140 Q462 148 484 140 Q506 132 528 140 Q550 148 572 140 Q594 132 616 140 Q638 148 660 140"
        fill="none" stroke="#13B5EA" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M-44 149 Q-22 141 0 149 Q22 157 44 149 Q66 141 88 149 Q110 157 132 149 Q154 141 176 149 Q198 157 220 149 Q242 141 264 149 Q286 157 308 149 Q330 141 352 149 Q374 157 396 149 Q418 141 440 149 Q462 157 484 149 Q506 141 528 149 Q550 157 572 149 Q594 141 616 149 Q638 157 660 149"
        fill="none" stroke="#FFB81C" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
