backend:
  name: git-gateway
  branch: main

# Global fallback for the media library. The listings collection below
# overrides this so each listing's uploads nest into their own subfolder.
media_folder: "public/images/listings"
public_folder: "/images/listings"

# Use Netlify Identity for login
local_backend: false

collections:
  - name: "listings"
    label: "Property Listings"
    label_singular: "Property Listing"
    folder: "src/content/listings"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "slug"
    # These resolve against the stored field paths — the grouped fields below
    # live under where./admin./pricing., so they need the full path.
    summary: "{{title}} — {{where.location}}"
    sortable_fields: ["title", "admin.order", "where.location", "where.propertyType"]
    # Each listing's photo uploads nest into their own slug subfolder,
    # e.g. public/images/listings/beachfront-resort-cashew-grove/
    # IMPORTANT: fill in the URL Slug field BEFORE uploading photos,
    # otherwise the subfolder name will be empty.
    media_folder: "/public/images/listings/{{slug}}"
    public_folder: "/images/listings/{{slug}}"


    # Fields are grouped into collapsible sections so the editor opens as a
    # short list of labelled boxes instead of a 25-field wall. Each group is an
    # object widget, which means the JSON nests under that group name — the
    # Astro schema flattens it straight back out, so the site is unaffected.
    #
    # title and slug stay OUTSIDE the groups on purpose: identifier_field and
    # the media_folder upload path resolve against top-level names only.
    fields:

      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The property name buyers see. e.g. Beachfront Resort — Cashew Grove"

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and hyphens only"]
        hint: "FILL THIS IN FIRST — before uploading any photos, or they save to an unnamed folder. Lowercase with hyphens, and different from every other listing. e.g. beachfront-resort-cashew-grove"

      # ── Photos & video ────────────────────────────────────────────────
      - label: "Photos & video"
        name: "media"
        widget: "object"
        collapsed: true
        fields:
          - label: "Hero image (main photo)"
            name: "heroImage"
            widget: "image"
            hint: "The big photo at the top of the property page, and the photo on the card. Landscape works best — about 1600px wide."

          - label: "Gallery photos"
            name: "gallery"
            widget: "image"
            allow_multiple: true
            media_library:
              config:
                multiple: true
            required: false
            hint: "Select several at once. Drag to reorder."

          - label: "YouTube videos"
            name: "youtube"
            widget: "list"
            label_singular: "Video"
            summary: "{{fields.video}}"
            required: false
            field:
              label: "YouTube video ID or URL"
              name: "video"
              widget: "string"
              hint: "e.g. 10Uvf7uNbrk or https://youtu.be/10Uvf7uNbrk"

      # ── The write-up ──────────────────────────────────────────────────
      - label: "The write-up"
        name: "copy"
        widget: "object"
        collapsed: true
        # No summary here on purpose: Decap can't truncate, so a long short
        # description makes this bar several lines tall and the boxes stop
        # lining up. The groups below only summarise short, always-set fields.
        fields:
          - label: "Short description"
            name: "shortDescription"
            widget: "text"
            hint: "ONE or TWO sentences — no more. This is the summary on the property card, the large heading on the property page, and the line Google shows. Long paragraphs belong in the full description below."

          - label: "Full description (paragraphs)"
            name: "description"
            widget: "list"
            label_singular: "Paragraph"
            collapsed: false
            summary: "{{fields.paragraph}}"
            field:
              label: "Paragraph"
              name: "paragraph"
              widget: "text"
            hint: "The main write-up. Add one paragraph at a time — click 'Add paragraph' for each new one."

          - label: "Investment highlights"
            name: "highlights"
            widget: "list"
            label_singular: "Highlight"
            summary: "{{fields.highlight}}"
            required: false
            field:
              label: "Highlight"
              name: "highlight"
              widget: "string"
            hint: "Short bullet points with green ticks. e.g. 180 meters of private beachfront"

      # ── Where it is ───────────────────────────────────────────────────
      - label: "Where it is"
        name: "where"
        widget: "object"
        collapsed: true
        summary: "{{fields.location}}  ·  {{fields.propertyType}}"
        fields:
          - label: "Location"
            name: "location"
            widget: "string"
            hint: "Shown under the title, and used for the Google Maps link. e.g. Busuanga, Coron, Palawan"

          - label: "Property type"
            name: "propertyType"
            widget: "select"
            options:
              - "Beachfront"
              - "Residential Lot"
              - "Commercial Land"
              - "Vacation Home"
              - "Resort"
              - "Investment"

          - label: "Access & location notes"
            name: "accessNotes"
            widget: "list"
            label_singular: "Note"
            summary: "{{fields.note}}"
            required: false
            field:
              label: "Note"
              name: "note"
              widget: "string"
            hint: "e.g. Minutes from El Nido Airport"

      # ── Size & features ───────────────────────────────────────────────
      - label: "Size & features"
        name: "specs"
        widget: "object"
        collapsed: true
        fields:
          - label: "Lot size (sqm)"
            name: "lotSizeSqm"
            widget: "number"
            required: false
            hint: "Numbers only, e.g. 6500. Shown as '6,500 sqm' unless you fill in the label below."

          - label: "Lot size — how it should read"
            name: "lotSizeLabel"
            widget: "string"
            required: false
            hint: "Optional. Use when hectares read better than sqm. e.g. 1.6 hectares"

          - label: "Beachfront (meters)"
            name: "beachfrontMeters"
            widget: "number"
            required: false
            hint: "Metres of shoreline the property actually fronts onto — not the lot size."

          - label: "Bedrooms"
            name: "bedrooms"
            widget: "number"
            required: false
            hint: "Leave blank for land with no building on it."

          - label: "Bathrooms"
            name: "bathrooms"
            widget: "number"
            required: false

          - label: "Floor area (sqm)"
            name: "floorAreaSqm"
            widget: "number"
            required: false
            hint: "The building's floor area, if there is one."

          - label: "Utilities & infrastructure"
            name: "utilities"
            widget: "list"
            label_singular: "Utility"
            summary: "{{fields.item}}"
            required: false
            field:
              label: "Item"
              name: "item"
              widget: "string"
            hint: "e.g. Reliable power distribution"

      # ── Price ─────────────────────────────────────────────────────────
      - label: "Price"
        name: "pricing"
        widget: "object"
        collapsed: true
        fields:
          - label: "Price"
            name: "price"
            widget: "number"
            required: false
            hint: "THE AMOUNT GOES HERE. Numbers only — no commas, no ₱ sign. e.g. 15000000 for ₱15,000,000. Leave blank to show 'Inquire for price' instead."

          - label: "Currency"
            name: "currency"
            widget: "select"
            options: ["PHP", "USD"]
            default: "PHP"
            hint: "Just the currency — the amount goes in the Price field above."

          - label: "Text to show when there is no price"
            name: "priceLabel"
            widget: "string"
            required: false
            default: "Inquire for price"
            hint: "Only used when the Price field above is left blank."

      # ── Google listing ────────────────────────────────────────────────
      - label: "Google listing"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - label: "SEO title"
            name: "metaTitle"
            widget: "string"
            required: false
            hint: "Optional. Shown in the browser tab and as the Google headline. Leave blank to use the property title."

          - label: "SEO description"
            name: "metaDescription"
            widget: "text"
            required: false
            hint: "Optional. The grey text under the Google result — around 150 characters. Leave blank to use the short description."

      # ── Admin ─────────────────────────────────────────────────────────
      - label: "Admin"
        name: "admin"
        widget: "object"
        collapsed: true
        summary: "{{fields.status}}  ·  sort order {{fields.order}}"
        fields:
          - label: "Status"
            name: "status"
            widget: "select"
            options: ["available", "reserved", "sold"]
            default: "available"
            hint: "'reserved' and 'sold' add a badge to the property card."

          - label: "Featured on homepage"
            name: "featured"
            widget: "boolean"
            default: false
            hint: "Turn on for the one property to headline the homepage. Only one at a time."

          - label: "Sort order"
            name: "order"
            widget: "number"
            default: 99
            hint: "Position in the properties list. 1 appears first, higher numbers appear later."

  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}  ·  {{category}}"
    sortable_fields: ["pubDate", "title", "category"]
    # Blog images upload here. Use WebP, ~1600px wide.
    media_folder: "/public/images/blog"
    public_folder: "/images/blog"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The article headline. Also becomes the page URL. e.g. 'El Nido Property for Sale: A Buyer's Guide'"

      - label: "Short description / excerpt"
        name: "description"
        widget: "text"
        hint: "1-2 sentences shown on the blog card and used as the Google search snippet if no SEO description is set."

      - label: "Publish date"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Last updated (optional)"
        name: "updatedDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "El Nido"
          - "Coron"
          - "Investment"
          - "Buying Guide"
          - "Palawan"

      - label: "Hero image"
        name: "heroImage"
        widget: "image"
        hint: "Main photo shown at the top of the post and on the blog card. Use WebP, ~1600px wide."

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Palawan Property Group"

      - label: "Tags"
        name: "tags"
        widget: "list"
        label_singular: "Tag"
        summary: "{{fields.tag}}"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"
        required: false
        hint: "Keywords for this post, e.g. el nido, buying land"

      - label: "Feature this post"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      - label: "Draft (hide from the site)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Turn ON to keep this post hidden while you work on it."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "The article. Use headings (##), bold, lists and links."

      - label: "SEO title (optional)"
        name: "metaTitle"
        widget: "string"
        required: false
        hint: "Shown in the browser tab and Google. Leave blank to use the title. Aim for under 60 characters."

      - label: "SEO description (optional)"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "Shown in Google search results. 150-160 characters ideal."
