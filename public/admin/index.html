<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Palawan Property Group — Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Handle invite and recovery tokens on the admin page
      window.addEventListener('load', function() {
        const hash = window.location.hash;
        if (hash && (hash.includes('invite_token') || hash.includes('recovery_token'))) {
          if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', function() {
              window.netlifyIdentity.open();
            });
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Renders the preview pane as the real site instead of a field dump.
         Loaded after the CMS bundle so window.CMS exists. -->
    <script src="/admin/preview.js"></script>
  </body>
</html>
